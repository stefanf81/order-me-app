name: CI

on:
  push:
    branches: [main]
    # A push to main that only changes docs doesn't rebuild or deploy: every build gets a new build number and date,
    # which would offer installed apps an "update" with nothing new in it. The PR has already run the checks.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/dependabot.yml']
  pull_request:
  # Weekly, so a break in the tooling (Playwright, its browser, a dependency) shows up on its own and not on the next change.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its older run. The event is in the group so a scheduled or manual run never
# replaces a push to main that is waiting to deploy.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit, not a movable tag; Dependabot (.github/dependabot.yml) proposes updates.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Known advisories in anything we ship fail the build; Dependabot proposes the fix.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:size
      # What is in this build, as CycloneDX: kept with the run for anyone auditing a deploy.
      - run: npm run sbom
      # The tested build itself, so the deploy below ships exactly this rather than a second build. The Playwright
      # specs run against it through the preview server below.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # What failed, kept for diagnosis: the HTML report with screenshots, and traces from a retried test.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Lints the workflow files themselves (bad expressions, unknown inputs, shell mistakes) before they run for real.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 -color # 1.7.12

  # Static analysis of the workflow files themselves (dangerous triggers, unpinned actions, injection), on top of
  # actionlint's syntax/expression checks and CodeQL's `actions` pack.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          # Annotations instead of SARIF: the job needs no security-events permission, and only serious findings fail it.
          advanced-security: false
          annotations: true
          min-severity: high
          min-confidence: high

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Every check on main gates the deploy, not just the tests: a failing workflow lint or zizmor finding blocks it too.
    needs: [test, workflow-lint, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # No checkout or install: the build is downloaded from the test job.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
